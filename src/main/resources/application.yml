spring:
  application:
    name: tuestudio-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/tuestudio
    username: tuestudio
    password: tuestudio
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  jackson:
    serialization:
      write-dates-as-timestamps: false

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/social/callback}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:tuestudio-dev-secret-key-change-in-production-min-32-chars}
  expiration-ms: 86400000

server:
  port: 8080
