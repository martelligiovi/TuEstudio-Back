# yamllint disable rule:line-length
spring:
  application:
    name: tuestudio-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tuestudio}
    username: ${SPRING_DATASOURCE_USERNAME:tuestudio}
    password: ${SPRING_DATASOURCE_PASSWORD:tuestudio}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
            scope: openid, profile, email
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:dev-linkedin-client-id}
            client-secret: ${LINKEDIN_CLIENT_SECRET:dev-linkedin-client-secret}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            jwk-set-uri: https://www.linkedin.com/oauth/openid/jwks
            user-name-attribute: sub
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${PROFILE_PHOTO_MAX_FILE_SIZE:2MB}
      max-request-size: ${PROFILE_PHOTO_MAX_REQUEST_SIZE:3MB}

jwt:
  secret: ${JWT_SECRET:tuestudio-dev-secret-key-change-in-production-min-32-chars}
  expiration-ms: 86400000

oauth2:
  cookie:
    signing-secret: ${OAUTH2_COOKIE_SECRET:tuestudio-dev-cookie-secret-change-in-prod}
  frontend-redirect-url: ${OAUTH2_FRONTEND_REDIRECT:http://localhost:5173/oauth2/callback}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  storage:
    profile-photos:
      bucket-name: ${GCS_PROFILE_PHOTOS_BUCKET:tuestudio-profile-photos}
      public-base-url: ${GCS_PROFILE_PHOTOS_PUBLIC_BASE_URL:https://storage.googleapis.com/tuestudio-profile-photos}
      object-prefix: ${GCS_PROFILE_PHOTOS_OBJECT_PREFIX:profile-photos}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
