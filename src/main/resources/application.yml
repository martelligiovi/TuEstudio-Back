spring:
  application:
    name: tuestudio-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/tuestudio
    username: tuestudio
    password: tuestudio
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
            scope: openid, profile, email
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:dev-linkedin-client-id}
            client-secret: ${LINKEDIN_CLIENT_SECRET:dev-linkedin-client-secret}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            jwk-set-uri: https://www.linkedin.com/oauth/openid/jwks
            user-name-attribute: sub
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:tuestudio-dev-secret-key-change-in-production-min-32-chars}
  expiration-ms: 86400000

oauth2:
  cookie:
    signing-secret: ${OAUTH2_COOKIE_SECRET:tuestudio-dev-cookie-secret-change-in-prod}
  frontend-redirect-url: ${OAUTH2_FRONTEND_REDIRECT:http://localhost:5173/oauth2/callback}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

server:
  port: 8080
