spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: openid, profile, email

jwt:
  secret: test-secret-key-for-testing-only-minimum-32-chars
  expiration-ms: 3600000

oauth2:
  cookie:
    signing-secret: test-cookie-secret-minimum-32-chars-ok
  frontend-redirect-url: http://localhost:5173/oauth2/callback

app:
  base-url: http://localhost:8080
