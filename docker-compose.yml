services:
  postgres:
    image: postgres:16
    container_name: tuestudio-postgres
    environment:
      POSTGRES_DB: tuestudio
      POSTGRES_USER: tuestudio
      POSTGRES_PASSWORD: tuestudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
